<div class="card">
  <div class="card-image">
    <img [src]="product().image" [alt]="product().title" />

    <button class="add-btn" (click)="cartService.addToCart(product())">+</button>
  </div>

  <div class="card-content">
    <div class="price-row">
      <span class="price"> {{ product().price }} ₽ </span>

      @if (product().oldPrice) {
        <span class="old-price"> {{ product().oldPrice }} ₽ </span>
      }

      @if (product().discount) {
        <span class="discount"> -{{ product().discount }}% </span>
      }
    </div>

    <h3>
      {{ product().title }}
    </h3>

    <p class="description">
      {{ product().description }}
    </p>
  </div>
</div>
