<header class="header">
  <div class="header-top">
    <button class="burger">
      <img src="images/burger.svg" alt="Burger Icon" />
    </button>

    <div class="logo">
      <img src="images/logo.svg" alt="Logo Icon" />
    </div>

    <div class="header-actions">
      <button class="search-btn">
        <img src="images/search.svg" alt="Search Icon" />
      </button>

      <button class="cart-btn" routerLink="/cart">
        <img src="images/cart.svg" alt="Cart Icon" />
        @if (cartService.totalItems() > 0) {
          <span class="cart-badge">
            {{ cartService.totalItems() }}
          </span>
        }
      </button>
    </div>
  </div>

  <nav class="header-nav">
    <a routerLink="/catalog">Новинки ✨</a>
    <a routerLink="">Одежда</a>
    <a routerLink="">Ошейники</a>
    <a routerLink="">Поводки</a>
    <a routerLink="">Головные уборы</a>
  </nav>
</header>
